<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jarvis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E" />
</head>
<body>

  <div id="login-screen">
    <div class="login-card">
      <div class="mark">🤖</div>
      <h1>Jarvis</h1>
      <p>Personal assistant · private</p>
      <form id="login-form">
        <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus />
        <button type="submit">Enter</button>
      </form>
      <div class="login-msg" id="login-msg"></div>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand"><span class="logo">🤖</span> Jarvis <span class="brand-sub" id="who">Console</span></div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-view="chat">Chat</button>
        <button class="tab" data-view="tasks">Tasks <span class="badge" id="badge-tasks"></span></button>
        <button class="tab" data-view="memory">Memory</button>
        <button class="tab" data-view="activity">Activity</button>
      </nav>
      <div class="status">
        <span><span class="dot" id="link-dot"></span> <span id="link-text">connecting</span></span>
        <span class="pill" id="state-pill">idle</span>
        <span>model <b id="model">—</b></span>
        <span>up <b id="clock">00:00</b></span>
      </div>
    </header>

    <main>
      <section class="view" id="view-chat">
        <div id="log"></div>
        <form id="composer">
          <textarea id="text" rows="1" placeholder="Message Jarvis" autocomplete="off"></textarea>
          <button type="submit" id="send">Send</button>
        </form>
      </section>

      <section class="view" id="view-tasks" hidden>
        <h2>Awaiting your approval <span class="count" id="pending-count">0</span></h2>
        <div id="pending-list"></div>
        <h2>Scheduled <span class="count" id="reminder-count">0</span></h2>
        <div id="reminder-list"></div>
        <h2>Recently done</h2>
        <div id="done-list"></div>
      </section>

      <section class="view" id="view-memory" hidden>
        <h2>What Jarvis knows about you <span class="count" id="memory-count">0</span></h2>
        <div id="memory-list"></div>
      </section>

      <section class="view" id="view-activity" hidden>
        <h2>Live activity</h2>
        <div class="feed" id="feed"></div>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
